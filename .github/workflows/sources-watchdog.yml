# Watchdog for every live source the map depends on. Every 6 hours it makes ONE
# lightweight request per source (no polling, no loops), the same way the map or the
# build reaches each one. If a source is unreachable, errors, blocks us (403/429), or
# has changed shape so our code would break, that step fails -> the whole run goes red
# -> GitHub e-mails the repository owner about the failed run automatically.
#
# It does NOT alarm on "nothing to show" (an empty sky, no gliders at a quiet hour):
# those are legitimate. Checks run from GitHub's runner IP, so this catches a source
# that is down / changed / blocking cloud IPs, but it cannot reproduce a ban specific
# to a home IP or a browser-only CORS problem.
#
# Every step carries `if: ${{ !cancelled() }}` so all sources are checked on each run
# even after an earlier one fails; the run's overall result is red if any step failed.
name: Sources watchdog

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Aircraft relay (Deno; ADS-B + MLAT)
        run: |
          set -e
          url="https://full-narwhal-4777.martinovem.deno.net/"
          hdr=$(mktemp)
          body=$(curl -sS -m 30 -D "$hdr" -H "Origin: https://martinovem.github.io" "$url" -w '\n%{http_code}')
          code=$(printf '%s' "$body" | tail -n 1)
          json=$(printf '%s' "$body" | sed '$d')
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "relay did not answer 200; body and X-Relay-Err follow:"
            grep -i 'x-relay-err' "$hdr" || true
            printf '%s' "$json" | head -c 400
            exit 1
          fi
          count=$(printf '%s' "$json" | python3 -c 'import sys, json; print(len(json.load(sys.stdin).get("ac", [])))')
          age=$(grep -i '^x-data-age-ms:' "$hdr" | tr -dc '0-9' || echo 0)
          echo "aircraft in the box: $count; data age: ${age:-?} ms"
          if [ "$count" -lt 1 ]; then
            echo "relay answered but the sky is empty — likely an upstream problem"
            exit 1
          fi
          # a fresh-looking 200 with OLD data means both aggregators are down
          # and the relay is serving its last remembered frame — alarm too
          if [ -n "$age" ] && [ "$age" -gt 120000 ]; then
            echo "relay data is stale (${age} ms old) — upstreams are not refreshing"
            exit 1
          fi

      - name: Zone data via relay (/zones -> CAA WFS, the weekly zone source)
        if: ${{ !cancelled() }}
        run: |
          # The weekly auto-update fetches the zones through the relay's /zones (a cached copy
          # of the CAA WFS). Mirror that path here. Alarm if the relay is unreachable / not 200
          # / not a sane FeatureCollection, OR if its cached copy is stale (could not refresh
          # for >26 h -> the upstream source may be down). Same host/origin build.py uses.
          hdr=$(mktemp)
          url="https://full-narwhal-4777.martinovem.deno.net/zones"
          code=$(curl -sS -m 60 -D "$hdr" -o body.json -w '%{http_code}' -H "Origin: https://martinovem.github.io" "$url") || code=000
          echo "HTTP $code"
          [ "$code" = "200" ] || { echo "relay /zones did not answer 200 (relay down or no cache)"; grep -i 'x-relay-err' "$hdr" || true; exit 1; }
          python3 -c 'import json; d=json.load(open("body.json")); assert d.get("type")=="FeatureCollection","not a FeatureCollection"; n=len(d.get("features",[])); print(n,"zones"); assert n>=100,"suspiciously few zones - feed may have broken"'
          age=$(grep -i '^x-zones-age-ms:' "$hdr" | head -1 | sed -E 's/^[^:]*:[[:space:]]*//' | tr -dc '0-9-')
          echo "cache age (ms): ${age:-unknown}"
          { [ -n "$age" ] && [ "$age" -ge 0 ] 2>/dev/null; } || { echo "relay has no fresh copy"; exit 1; }
          [ "$age" -le 93600000 ] || { echo "relay's copy is stale (>26 h) - the upstream source may be down"; exit 1; }
          echo "Zone data via relay ok"

      - name: Open-Meteo (weather + rain/snow/wind/cloud models)
        if: ${{ !cancelled() }}
        run: |
          # ONE tiny single-point query (not the heavy grid the map builds) asking for the
          # fields we depend on, including wind at 120 m (the legal ceiling).
          url="https://api.open-meteo.com/v1/forecast?latitude=42.7&longitude=23.3&hourly=wind_speed_120m,cloud_cover,snowfall,precipitation&wind_speed_unit=ms&forecast_days=1"
          code=$(curl -sS -m 30 -o body.json -w '%{http_code}' "$url") || code=000
          echo "HTTP $code"
          [ "$code" = "200" ] || { echo "Open-Meteo did not answer 200"; exit 1; }
          python3 -c 'import json; d=json.load(open("body.json")); v=d["hourly"]["wind_speed_120m"]; assert isinstance(v, list) and v, "wind_speed_120m missing or empty"; print("hourly fields present:", len(v), "hours")'

      - name: EUMETSAT satellite (cloud layer)
        if: ${{ !cancelled() }}
        run: |
          # Tiny 2x2 GetMap of the cloud-mask layer the map uses; a renamed/removed layer
          # returns an XML ServiceException (not an image), which we detect by content-type.
          url="https://view.eumetsat.int/geoserver/ows?service=WMS&version=1.1.1&request=GetMap&srs=EPSG:3857&bbox=2500000,5200000,2600000,5300000&width=2&height=2&format=image/png&transparent=true&layers=msg_fes:clm"
          ct=$(curl -sS -m 45 -o body.bin -w '%{content_type}' "$url") || ct=none
          echo "content-type: $ct"
          printf '%s' "$ct" | grep -qi 'image' \
            || { echo "EUMETSAT did not return an image (layer renamed/removed or service down):"; head -c 400 body.bin; exit 1; }
          echo "cloud-mask layer renders"

      - name: RainViewer (rain-radar frames)
        if: ${{ !cancelled() }}
        run: |
          code=$(curl -sS -m 30 -o body.json -w '%{http_code}' "https://api.rainviewer.com/public/weather-maps.json") || code=000
          echo "HTTP $code"
          [ "$code" = "200" ] || { echo "RainViewer index did not answer 200"; exit 1; }
          python3 -c 'import json; d=json.load(open("body.json")); f=d.get("radar",{}).get("past",[]); assert f, "no radar.past frames"; print(len(f), "radar frame(s); host", d.get("host"))'

      - name: Photon (place search + reverse geocode)
        if: ${{ !cancelled() }}
        run: |
          code=$(curl -sS -m 30 -o body.json -w '%{http_code}' "https://photon.komoot.io/api/?q=Sofia&limit=1") || code=000
          echo "HTTP $code"
          [ "$code" = "200" ] || { echo "Photon did not answer 200"; exit 1; }
          python3 -c 'import json; d=json.load(open("body.json")); assert d.get("type")=="FeatureCollection" and isinstance(d.get("features"),list) and d["features"], "no search results"; print("search returned", len(d["features"]), "feature(s)")'

      - name: OGN gliders (live.glidernet.org)
        if: ${{ !cancelled() }}
        run: |
          # Must be reachable and valid XML. Zero gliders is legitimate at quiet hours or
          # in winter, so we do NOT alarm on an empty list — only on unreachable/bad format.
          code=$(curl -sS -m 30 -o body.xml -w '%{http_code}' "https://live.glidernet.org/lxml.php?a=0&b=49&c=36&d=33.5&e=17") || code=000
          echo "HTTP $code"
          [ "$code" = "200" ] || { echo "OGN did not answer 200"; exit 1; }
          grep -qi '<marker' body.xml || head -c 40 body.xml | grep -qi '<?xml' \
            || { echo "OGN response is not the expected XML (format changed or blocked):"; head -c 300 body.xml; exit 1; }
          echo "OGN XML ok"

      - name: GPS-interference feed (relay /gpsown - our own layer)
        if: ${{ !cancelled() }}
        run: |
          # Our OWN GPS-interference layer (Deno.cron collects 24/7 into Deno KV).
          # Alarm on unreachable / error / bad format / empty, AND when the
          # collector is not writing the CURRENT UTC hour (X-Gpsown-Cur: 0 =
          # the cron or KV is broken - the served picture would silently age).
          hdr=$(mktemp)
          code=$(curl -sS -m 30 -D "$hdr" -o body.json -w '%{http_code}' -H "Origin: https://martinovem.github.io" "https://full-narwhal-4777.martinovem.deno.net/gpsown") || code=000
          echo "HTTP $code"
          [ "$code" = "200" ] || { echo "gpsown relay did not answer 200; X-Relay-Err follows:"; grep -i 'x-relay-err' "$hdr" || true; exit 1; }
          python3 -c "import json; d=json.load(open('body.json')); assert d.get('type')=='FeatureCollection','not a FeatureCollection'; n=len(d.get('features',[])); print(n,'cells, mode',d.get('mode')); assert n>0,'no cells'"
          cur=$(grep -i '^x-gpsown-cur:' "$hdr" | tr -d '\r' | awk '{print $2}')
          echo "current-hour collecting: ${cur:-?}"
          [ "$cur" = "1" ] || { echo "gpsown collector is NOT writing the current hour (cron/KV problem)"; exit 1; }

      - name: Airspace feed (relay /airspace over OpenAIP)
        if: ${{ !cancelled() }}
        run: |
          # Valid GeoJSON with airspace polygons. Alarm on unreachable / error / empty /
          # bad format (a source or relay problem); a normal day has ~189 features.
          hdr=$(mktemp)
          code=$(curl -sS -m 30 -D "$hdr" -o body.json -w '%{http_code}' -H "Origin: https://martinovem.github.io" "https://full-narwhal-4777.martinovem.deno.net/airspace") || code=000
          echo "HTTP $code"
          [ "$code" = "200" ] || { echo "airspace relay did not answer 200; X-Relay-Err follows:"; grep -i 'x-relay-err' "$hdr" || true; exit 1; }
          python3 -c "import json; d=json.load(open('body.json')); assert d.get('type')=='FeatureCollection','not a FeatureCollection'; n=len(d.get('features',[])); print(n,'airspace features'); assert n>0,'no airspace features'"

      - name: NOTAM feed (relay /notam over FAA NMS-API)
        if: ${{ !cancelled() }}
        run: |
          # Valid GeoJSON. ZERO drawn NOTAMs is legitimate (a quiet day with no active
          # drone-relevant restrictions) - alarm only on unreachable / error / bad format,
          # AND on stale data: with the KV cache the relay answers 200 forever, so the
          # real health signal is X-Notam-Age-Ms (time since the newest successful FAA
          # poll). > 90 min = FAA or the poller has been down for a while.
          # A 502 "no notam creds" means the relay's Deno env vars aren't set.
          hdr=$(mktemp)
          code=$(curl -sS -m 30 -D "$hdr" -o body.json -w '%{http_code}' -H "Origin: https://martinovem.github.io" "https://full-narwhal-4777.martinovem.deno.net/notam") || code=000
          echo "HTTP $code"
          [ "$code" = "200" ] || { echo "notam relay did not answer 200; X-Relay-Err follows:"; grep -i 'x-relay-err' "$hdr" || true; exit 1; }
          python3 -c "import json; d=json.load(open('body.json')); assert d.get('type')=='FeatureCollection','not a FeatureCollection'; print(len(d.get('features',[])),'notam features')"
          age=$(grep -i '^x-notam-age-ms:' "$hdr" | tr -d '\r' | awk '{print $2}')
          echo "notam age: ${age:-?} ms"
          [ -n "$age" ] && [ "$age" -lt 5400000 ] || { echo "notam data is STALE (> 90 min since the last FAA poll) or the age header is missing"; exit 1; }
